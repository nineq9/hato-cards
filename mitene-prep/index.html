<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>みてね準備</title><style>
:root{--pink:#ee7fa5;--text:#242424;--sub:#8e8e93;--line:#e5e5ea;--section:#f4f4f7;--blue:#0a84ff;--tab:76px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eee;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;color:inherit}.app{width:min(430px,100vw);min-height:100dvh;margin:auto;background:#fff}.view{display:none;min-height:100dvh;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}.view.on{display:block}.safe{height:calc(env(safe-area-inset-top) + 8px)}.title{height:62px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border-bottom:1px solid var(--line)}.head{border-bottom:1px solid var(--line)}.year{height:56px;display:grid;grid-template-columns:60px 1fr 88px;align-items:center;padding:0 12px}.year b{text-align:center;font-size:21px}.crown{width:34px;height:34px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center}.actions{text-align:right;font-size:26px;letter-spacing:5px}.months{height:48px;display:grid;grid-template-columns:repeat(6,1fr)}.month{border:0;background:#fff;font-size:17px;color:#666;position:relative}.month.on{color:var(--pink);font-weight:600}.month.on:after{content:"";height:3px;background:var(--pink);position:absolute;left:12%;right:12%;bottom:0}.cover{height:360px;position:relative;overflow:hidden}.cover img,.grid img,.feedpics img,.pick img{width:100%;height:100%;object-fit:cover}.cover:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.25))}.covertext{position:absolute;z-index:2;left:20px;bottom:22px;color:#fff}.covertext b{font-size:34px}.covertext span{display:block;font-size:17px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid div{aspect-ratio:1;overflow:hidden;position:relative}.tag{position:absolute;left:6px;bottom:6px;background:#0008;color:#fff;font-size:10px;padding:3px 5px ion:relative;overflow:hidden}.check{position:absolute;right:7px;top:7px;width:29px;height:29px;border:2px solid #fff;border-radius:50%;background:#0002}.pick.sel .check{background:var(--pink)}.pick.sel .check:after{content:"✓";color:#fff;font-weight:800}.sendfoot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom));width:min(430px,100vw);height:76px;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:grid;grid-template-columns:1fr 95px;gap:9px;z-index:8}.primary{border:0;border-radius:8px;background:var(--pink);color:#fff;font-weight:700}.secondary{border:1px solid var(--line);border-radius:8px;background:#fff}.settingshead{background:var(--section);padding:18px 18px 10px;color:#777;font-size:14px}.setting{min-height:67px;border-bottom:1px solid var(--line);margin-left:18px;padding:10px 18px 10px 0;display:flex;align-items:center}.setting .grow{flex:1}.setting small{display:block;color:var(--sub);margin-top:3px}.tabbar{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100vw);height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.tab{border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.tab i{font-style:normal;font-size:26px;line-height:1}.tab.active{font-weight:700}.overlay{display:none;position:fixed;z-index:50;inset:0;background:#0004;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(430px,100vw);background:#fff;border-radius:18px 18px 0 0;padding:9px 0 calc(14px + env(safe-area-inset-bottom));overflow:hidden}.handle{width:36px;height:5px;background:#d7d7db;border-radius:5px;margin:0 auto 10px}.sheettitle{text-align:center;font-size:18px;font-weight:700;padding:8px 16px 15px}.sheetrow{width:100%;min-height:68px;border:0;border-top:1px solid var(--line);background:#fff;padding:8px 18px;display:grid;grid-template-columns:44px minmax(0,1fr) 24px;gap:13px;align-items:center;text-align:left}.sheeticon{width:44px;height:44px;border-radius:50%;background:#f5f5f7;display:grid;place-items:center;font-size:18px}.sheetrow .copy{min-width:0}.sheetrow b{display:block;color:var(--blue);font-size:16px;font-weight:500}.sheetrow small{display:block;color:var(--sub);font-size:12px;margin-top:3px;white-space:normal}.close{width:calc(100% - 28px);height:50px;margin:10px 14px 0;border:0;border-radius:10px;background:#f2f2f5;color:var(--blue);font-weight:600}.hint{padding:12px 18px;background:#fff8fa;border-bottom:1px solid #f3e4e9;font-size:13px;line-height:1.45}.hint b{color:#d85f8b}.toast{display:none;position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:105px;background:#222e;color:#fff;padding:10px 14px;border-radius:18px;font-size:13px}.toast.show{display:block}
</style></head><body><div class="app">
<section id="album" class="view on"><div class="safe"></div><div class="head"><div class="year"><div class="crown">♛</div><b>2026</b><div class="actions">⌕ ···</div></div><div class="months"><button class="month on">8</button><button class="month">7</button><button class="month">6</button><button class="month">5</button><button class="month">4</button><button class="month">3</button></div></div><div class="hint"><b>送る準備ができています</b>　8月17日の31件</div><div class="cover"><img src="https://gibsonphoto.ca/wp-content/uploads/2024/05/14-21279-post/newborn-photography-brampton.4-scaled.jpg"><div class="covertext"><b>August</b><span>2026</span></div></div><div class="grid"><div><img src="https://images-pw.pixieset.com/page/417476/5A3A2213pK-2-c45fe501.jpg"></div><div><img src="https://cdn.alboompro.com/6078e135b185090001bfd8c2_644f6ad4e34219000182ca69/large/resolucao-web-12.jpg?v=1"></div><div><img src="https://images.squarespace-cdn.com/content/v1/631c8ab9dfa9482a32d17001/936e6f14-1c74-4242-a428-ddf374280232/Newborn-14.jpg"></div><div><img src="https://gibsonphoto.ca/wp-content/uploads/2024/05/14-21279-post/newborn-photography-brampton.4-scaled.jpg"><span class="tag">1:50</span></div><div><img src="https://images-pw.pixieset.com/page/417476/5A3A2213pK-2-c45fe501.jpg"></div><div><img src="https://cdn.alboompro.com/6078e135b185090001bfd8c2_644f6ad4e34219000182ca69/large/resolucao-web-12.jpg?v=1"></div></div><div class="sendrow"><div class="grow"><b>8月17日</b><small>写真24枚・動画7本</small></div><button class="sendlink" onclick="openSend('2026年8月17日')">みてねに送る ›</button></div><div class="section">昔の写真</div><div class="listrow" onclick="openSend('昔の写真')"><div class="grow"><b>昔の写真も続きがあります</b><small>残り642件</small></div><div class="chev">›</div></div></section>
<section id="activity" class="view"><div class="safe"></div><div class="title">近況</div><div class="section">まとめる人</div><div class="people"><div class="person"><div class="bubble p1">みる</div><span>赤ちゃん</span></div><div class="person"><div class="bubble p2">りさ</div><span>妹</span></div><div class="person"><div class="bubble p3">全</div><span>全部</span></div></div><div class="section">最近</div><div class="feed"><div class="feedtop"><div class="feedicon">写真</div><div><div class="feedtext">8月17日の写真・動画を31点まとめました</div><div class="feedtime">今日</div></div></div><div class="feedpics"><img src="https://images-pw.pixieset.com/page/417476/5A3A2213pK-2-c45fe501.jpg"><img src="https://cdn.alboompro.com/6078e135b185090001bfd8c2_644f6ad4e34219000182ca69/large/resolucao-web-12.jpg?v=1"><img src="https://gibsonphoto.ca/wp-content/uploads/2024/05/14-21279-post/newborn-photography-brampton.4-scaled.jpg"></div></div></section>
<section id="send" class="view"><div class="safe"></div><div class="sendtop"><button onclick="show('album')">×</button><b>みてねに送る写真</b><span></span></div><div class="date"><span id="dateLabel">2026年8月17日</span><div class="circle"></div></div><div class="picks" id="picks"><button class="pick sel"><img src="https://gibsonphoto.ca/wp-content/uploads/2024/05/14-21279-post/newborn-photography-brampton.4-scaled.jpg"><i class="check"></i></button><button class="pick sel"><img src="https://images-pw.pixieset.com/page/417476/5A3A2213pK-2-c45fe501.jpg"><i class="check"></i></button><button class="pick sel"><img src="https://cdn.alboompro.com/6078e135b185090001bfd8c2_644f6ad4e34219000182ca69/large/resolucao-web-12.jpg?v=1"><i class="check"></i></button><button class="pick sel"><img src="https://images.squarespace-cdn.com/content/v1/631c8ab9dfa9482a32d17001/936e6f14-1c74-4242-a428-ddf374280232/Newborn-14.jpg"><i class="check"></i></button><button class="pick sel"><img src="https://images-pw.pixieset.com/page/417476/5A3A2213pK-2-c45fe501.jpg"><i class="check"></i></button><button class="pick sel"><img src="https://gibsonphoto.ca/wp-content/uploads/2024/05/14-21279-post/newborn-photography-brampton.4-scaled.jpg"><i class="check"></i></button></div><div class="sendfoot"><button class="primary" onclick="sheet('confirm')"><span id="count">6</span>件をみてねに送る</button><button class="secondary" onclick="show('album')">あとで</button></div></section>
<section id="settings" class="view"><div class="safe"></div><div class="title">設定</div><div class="settingshead">まとめる人</div><div class="setting"><div class="grow"><b>赤ちゃん</b><small>この人が写っている写真・動画</small></div><span>選択中</span></div><div class="setting"><div class="grow"><b>妹</b><small>この人の写真もまとめる</small></div><div class="chev">›</div></div><div class="settingshead">まとめ方</div><div class="setting"><div class="grow"><b>長い動画</b><small>みてねに送れる長さに分ける</small></div><span>自動</span></div><div class="setting"><div class="grow"><b>元の写真は消しません</b><small>写真・動画はそのまま残します</small></div></div></section>
<nav class="tabbar"><button class="tab active" data-v="album" onclick="show('album')"><i>⌂</i><span>アルバム</span></button><button class="tab" data-v="activity" onclick="show('activity')"><i>▤</i><span>近況</span></button><button class="tab" onclick="sheet('add')"><i>⊕</i><span>まとめる</span></button><button class="tab" data-v="send" onclick="openSend('2026年8月17日')"><i>↗</i><span>送る</span></button><button class="tab" data-v="settings" onclick="show('settings')"><i>♙</i><span>設定</span></button></nav></div>
<div id="add" class="overlay" onclick="if(event.target===this)hide('add')"><div class="sheet"><div class="handle"></div><div class="sheettitle">何をまとめますか？</div><button class="sheetrow" onclick="hide('add');openSend('今日までの写真')"><div class="sheeticon">今</div><div class="copy"><b>今の写真をまとめる</b><small>いつもの写真・動画をみてねへ</small></div><div class="chev">›</div></button><button class="sheetrow" onclick="hide('add');openSend('昔の写真')"><div class="sheeticon">昔</div><div class="copy"><b>昔の写真をまとめる</b><small>過去の写真を少しずつみてねへ</small></div><div class="chev">›</div></button><button class="sheetrow" onclick="hide('add');show('settings')"><div class="sheeticon">人</div><div class="copy"><b>まとめる人を変える</b><small>赤ちゃん・妹・全部から選ぶ</small></div><div class="chev">›</div></button><button class="close" onclick="hide('add')">キャンセル</button></div></div>
<div id="confirm" class="overlay" onclick="if(event.target===this)hide('confirm')"><div class="sheet"><div class="handle"></div><div class="sheettitle">この写真をみてねに送ります</div><button class="sheetrow" onclick="hide('confirm');done()"><div class="sheeticon">送</div><div class="copy"><b>みてねに送る</b><small>元の写真や動画は消しません</small></div><div class="chev">›</div></button><button class="close" onclick="hide('confirm')">戻る</button></div></div><div id="toast" class="toast"></div>
<script>const views=[...document.querySelectorAll('.view')],tabs=[...document.querySelectorAll('.tab[data-v]')];function show(id){views.forEach(v=>v.classList.toggle('on',v.id===id));tabs.forEach(t=>t.classList.toggle('active',t.dataset.v===id));window.scrollTo(0,0)}function sheet(id){document.getElementById(id).classList.add('show')}function hide(id){document.getElementById(id).classList.remove('show')}function openSend(label){document.getElementById('dateLabel').textContent=label;show('send')}const picks=[...document.querySelectorAll('.pick')];picks.forEach(p=>p.onclick=()=>{p.classList.toggle('sel');document.getElementById('count').textContent=document.querySelectorAll('.pick.sel').length});function done(){show('activity');const t=document.getElementById('toast');t.textContent='送った写真として記録しました';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}</script></body></html>
