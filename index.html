<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe9" />
  <title>HATO CARDS</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuOpen" aria-label="メニュー">☰</button>
      <div class="brand">HATO <span>CARDS</span></div>
      <button class="icon-btn" id="undoTop" aria-label="ひとつ戻す">↶</button>
    </header>

    <main class="main">
      <section id="batchIntro" class="batch-intro">
        <div class="eyebrow">NEW CARDS</div>
        <h1>新しいカードが<br><span id="batchCount">4</span>枚届きました。</h1>
        <p>立ち上がって、部屋を少し歩きながらどうぞ。</p>
        <button id="startBatch" class="primary">カードを見る</button>
      </section>

      <section id="cardStage" class="card-stage hidden" aria-live="polite">
        <div class="outside-progress"><span id="position">1</span> / <span id="total">4</span><span class="outside-label">NEW CARDS</span></div>
        <div id="deck" class="deck"></div>
        <div class="gesture-legend"><span>← 知ってる</span><span>↑ あとで読む</span><span>もっと知る →</span></div>
      </section>

      <section id="clearScreen" class="clear-screen hidden">
        <div class="clear-orbit" aria-hidden="true"><span></span></div>
        <div class="eyebrow">NEW CARDS CLEAR</div>
        <div class="clear-score"><span id="clearDone">4</span> / <span id="clearTotal">4</span></div>
        <h2>今届いていた世界は、<br>ここまで。</h2>
        <p id="clearStats">4 stories screened</p>
        <div class="reward">少し身体も動いた。<br>また、自分の時間へ。</div>
      </section>
    </main>
  </div>

  <aside id="detail" class="detail" aria-hidden="true">
    <header class="detail-bar">
      <button id="detailBack" class="icon-btn" aria-label="カードへ戻る">←</button>
      <div id="detailPosition" class="detail-position">1 / 4</div>
      <button id="detailSave" class="detail-save" aria-label="あとで読む">↑</button>
    </header>
    <div class="detail-scroll">
      <div id="detailHero" class="detail-hero"></div>
      <div class="detail-body">
        <div id="detailCountry" class="detail-country"></div>
        <div id="detailTags" class="tags"></div>
        <h2 id="detailTitle"></h2>
        <p id="detailDek" class="detail-dek"></p>
        <section class="article-section"><h3>3行でわかる</h3><p id="detailThree"></p></section>
        <section class="article-section"><h3>何が起きた？</h3><p id="detailWhat"></p></section>
        <section class="article-section"><h3>なぜ重要？</h3><p id="detailWhy"></p></section>
        <section class="article-section"><h3>次に見るポイント</h3><p id="detailWatch"></p></section>
        <section class="article-section"><h3>情報源</h3><p id="detailSource"></p></section>
      </div>
    </div>
    <div class="detail-hint">← 左スワイプでカードへ戻る</div>
  </aside>

  <aside id="menu" class="menu-sheet" aria-hidden="true">
    <div class="menu-head"><strong>HATO CARDS</strong><button id="menuClose" class="icon-btn" aria-label="閉じる">×</button></div>
    <button id="menuNow" class="menu-item">NEW CARDS <span>いま届いているカード</span></button>
    <button id="menuSaved" class="menu-item">SAVED <span id="savedCount">0</span></button>
    <div id="savedList" class="saved-list hidden"></div>
  </aside>
  <div id="menuScrim" class="menu-scrim"></div>

  <div id="undoToast" class="undo-toast"><span id="undoText">戻せます</span><button id="undoBtn">戻す ↶</button></div>
  <script src="./app.js" defer></script>
</body>
</html>
