<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GEKKO Storage Outcomes</title>
<style>
:root{
  --bg:#f6f4ef;--surface:#fbfaf7;--text:#20201e;--muted:#8d8982;--line:rgba(32,32,30,.10);--soft:#ece8e0;--fill:#282724;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root{--bg:#151513;--surface:#1f1f1c;--text:#f1efe9;--muted:#9e9a92;--line:rgba(255,255,255,.10);--soft:#2b2a26;--fill:#efede7}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}.page{min-height:100dvh;padding:calc(22px + var(--safe-top)) 20px calc(36px + var(--safe-bottom));display:flex;justify-content:center}.shell{width:min(100%,520px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-size:17px;font-weight:650;letter-spacing:.055em}.segmented{display:flex;background:var(--soft);border-radius:13px;padding:3px;gap:2px}.segmented button{border:0;background:transparent;padding:8px 11px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600}.segmented button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 8px rgba(0,0,0,.06)}
.view{display:none}.view.active{display:block}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:8px}.headline{font-size:28px;line-height:1.15;letter-spacing:-.04em;font-weight:680;margin:0}.counts{display:flex;gap:18px;margin-top:12px;color:var(--muted);font-size:13px}
.hero{margin-top:42px}.hero-number{font-size:54px;line-height:.95;letter-spacing:-.055em;font-weight:720;font-variant-numeric:tabular-nums}.hero-label{margin-top:8px;color:var(--muted);font-size:15px}
.card{margin-top:34px;background:var(--surface);border:.5px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 14px 40px rgba(49,44,36,.045)}.card-title{font-size:15px;font-weight:650}.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:20px}.bar>span{display:block;height:100%;width:84%;background:var(--fill);border-radius:inherit}.free{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-top:22px}.free-block small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.free-block strong{font-size:18px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.arrow{color:var(--muted);font-size:18px;padding-bottom:2px}.gain{margin-top:22px;padding-top:18px;border-top:.5px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}.gain span{color:var(--muted);font-size:12px}.gain strong{font-size:22px;font-variant-numeric:tabular-nums}
.cumulative{margin-top:30px}.cumulative-label{font-size:12px;color:var(--muted)}.cumulative-value{margin-top:5px;font-size:23px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.note{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.65}
.home-preview{padding-top:10vh}.home-title{font-size:13px;color:var(--muted);margin-bottom:14px}.mini{background:var(--surface);border:.5px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 40px rgba(49,44,36,.045)}.mini-free{font-size:30px;font-weight:680;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.mini-sub{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.5}.mini .bar{margin-top:18px;height:8px}
.mock-controls{margin-top:34px;display:flex;justify-content:center}.mock-controls button{min-height:44px;padding:0 16px;border:.5px solid var(--line);background:transparent;border-radius:14px;font-size:13px;color:var(--muted)}
@media(max-width:360px){.page{padding-left:16px;padding-right:16px}.top{align-items:flex-start;flex-direction:column;margin-bottom:24px}.headline{font-size:25px}.hero{margin-top:34px}.hero-number{font-size:46px}.free{gap:8px}.free-block strong{font-size:16px}.card{padding:18px}.segmented{align-self:stretch}.segmented button{flex:1}}
@media(prefers-reduced-motion:no-preference){.view.active{animation:fade .18s ease}@keyframes fade{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="page">
  <div class="shell">
    <header class="top">
      <div class="brand">GEKKO</div>
      <div class="segmented" role="tablist" aria-label="表示切り替え">
        <button class="active" id="tabOutcome" role="tab" aria-selected="true">整理完了</button>
        <button id="tabHome" role="tab" aria-selected="false">ホーム表示</button>
      </div>
    </header>

    <section class="view active" id="outcomeView">
      <div class="eyebrow">整理完了</div>
      <h1 class="headline">今日もすっきり。</h1>
      <div class="counts" aria-label="今回の整理結果"><span>127枚 整理</span><span>73枚 削除</span></div>

      <div class="hero" aria-label="今回取り戻した容量 1.8ギガバイト">
        <div class="hero-number">1.8 GB</div>
        <div class="hero-label">取り戻しました</div>
      </div>

      <section class="card" aria-label="iPhoneストレージ">
        <div class="card-title">iPhoneストレージ</div>
        <div class="bar" role="progressbar" aria-label="ストレージ使用状況" aria-valuenow="84" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        <div class="free">
          <div class="free-block"><small>整理前</small><strong>18.2 GB FREE</strong></div>
          <div class="arrow" aria-hidden="true">→</div>
          <div class="free-block"><small>整理後</small><strong>20.0 GB FREE</strong></div>
        </div>
        <div class="gain"><span>今回増えた空き容量</span><strong>+1.8 GB</strong></div>
      </section>

      <section class="cumulative" aria-label="GEKKO累計 12.6ギガバイト">
        <div class="cumulative-label">GEKKO累計</div>
        <div class="cumulative-value">12.6 GB reclaimed</div>
      </section>

      <p class="note">※ これはSafari確認用のモックです。実機版ではiOSから取得できる端末全体容量と空き容量を使用し、取得できない「写真 / アプリ / iOS / システムデータ」などの内訳は推測して表示しません。</p>
    </section>

    <section class="view" id="homeView">
      <div class="home-preview">
        <div class="home-title">ホーム用コンポーネント</div>
        <div class="mini" aria-label="空き容量 20ギガバイト。GEKKOで累計12.6ギガバイト取り戻しました">
          <div class="mini-free">20.0 GB FREE</div>
          <div class="mini-sub">GEKKOで 12.6 GB 取り戻しました</div>
          <div class="bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </section>
  </div>
</main>
<script>
const outcome=document.getElementById('outcomeView'),home=document.getElementById('homeView');
const t1=document.getElementById('tabOutcome'),t2=document.getElementById('tabHome');
function show(which){const isOutcome=which==='outcome';outcome.classList.toggle('active',isOutcome);home.classList.toggle('active',!isOutcome);t1.classList.toggle('active',isOutcome);t2.classList.toggle('active',!isOutcome);t1.setAttribute('aria-selected',String(isOutcome));t2.setAttribute('aria-selected',String(!isOutcome));}
t1.addEventListener('click',()=>show('outcome'));t2.addEventListener('click',()=>show('home'));
</script>
</body>
</html>
