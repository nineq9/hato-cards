<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#081113" />
  <meta name="color-scheme" content="dark light" />
  <title>KAWASEMI LIVE TRACE — Interaction Demo</title>
  <link rel="stylesheet" href="./live-trace.css?v=3" />
  <link rel="stylesheet" href="./live-trace-qa.css?v=1" />
</head>
<body>
  <main class="shell" aria-label="KAWASEMI LIVE TRACE demo">
    <header class="topbar">
      <div class="topline">
        <div class="mode-title">LIVE</div>
        <span id="clock" class="clock" aria-label="現在時刻">--:--:--</span>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="ライトテーマに切り替える">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <div class="trace-line"><i aria-hidden="true"></i><strong>TRACE</strong><span>NOW · ARRIVAL TIME</span></div>
    </header>

    <section class="controls" aria-label="LIVE表示切り替え">
      <div class="segmented" role="group" aria-label="Signal表示">
        <button id="groupedBtn" class="active" type="button" aria-pressed="true">GROUPED</button>
        <button id="allBtn" type="button" aria-pressed="false">ALL SIGNALS</button>
      </div>
      <button id="pauseBtn" class="pause-btn" type="button" aria-label="Signal追加を一時停止">Ⅱ</button>
    </section>

    <section class="since" aria-label="前回確認からの変化">
      <div>
        <small>SINCE YOU LAST CHECKED</small>
        <strong id="sinceSummary">—</strong>
        <span id="sinceDetail">—</span>
      </div>
      <button id="newInfoBtn" class="quiet-action" type="button">VIEW →</button>
    </section>

    <section class="timeline-wrap">
      <div class="now-marker">
        <span class="time">NOW</span>
        <span class="now-dot" aria-hidden="true"></span>
        <span class="now-label">INCOMING</span>
      </div>
      <div id="timeline" class="timeline" aria-live="polite"></div>
    </section>
  </main>

  <button id="newReturn" class="new-return hidden" type="button">1 new signal · ↑ NOW</button>

  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <section id="detailSheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetLabel">
    <div class="handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <button id="sheetBack" class="sheet-back hidden" type="button" aria-label="前のLIVE詳細へ戻る">‹</button>
      <small id="sheetLabel">EVENT CLUSTER</small>
      <button id="closeSheet" type="button" aria-label="LIVE詳細を閉じる">×</button>
    </header>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <section id="cardPreview" class="card-preview hidden" aria-hidden="true" aria-label="CARDS handoff preview">
    <header class="card-preview-head">
      <button id="cardBack" type="button" aria-label="LIVEへ戻る">‹</button>
      <strong>CARDS</strong>
      <span></span>
    </header>
    <div id="cardPreviewBody" class="card-preview-scroll"></div>
  </section>

  <script src="./live-trace.js?v=2" defer></script>
</body>
</html>
