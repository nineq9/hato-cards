<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe8">
<meta name="color-scheme" content="light dark">
<title>KAWASEMI — Tap Source v2</title>
<style>
:root{--bg:#f2efe8;--surface:#f8f6f1;--ink:#142022;--muted:#6f7a78;--line:rgba(20,32,34,.12);--teal:#118995;--card:#0b1618;--card-ink:#f6f4ef;--card-muted:#cfd6d3;--card-line:rgba(246,244,239,.15);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#081113;--surface:#0e181a;--ink:#f4f2eb;--muted:#8d9996;--line:rgba(244,242,235,.12)}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:calc(8px + var(--safe-top)) 14px calc(14px + var(--safe-bottom));overflow:hidden}.topbar{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:11px;letter-spacing:.19em;font-weight:700;color:var(--muted)}.lab{font-size:9px;letter-spacing:.12em;color:var(--muted)}.stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:none}.card{position:relative;width:min(94vw,500px);height:min(79dvh,690px);border-radius:28px;overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.07);color:var(--card-ink);will-change:transform,opacity;user-select:none;-webkit-user-select:none;touch-action:none}.hero{position:absolute;inset:0 0 52% 0;background:radial-gradient(circle at 72% 28%,rgba(76,157,151,.32),transparent 24%),linear-gradient(145deg,#18383b,#0b1d20 58%,#081214)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,14,.06),rgba(5,12,14,.2) 56%,#0b1618 100%)}.card-body{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 20px 18px}.meta{display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.08em;color:rgba(246,244,239,.76)}.content{margin-top:auto}.eyebrow{font-size:9px;letter-spacing:.14em;color:#a9d5cf;font-weight:700;margin-bottom:10px}.title{margin:0;font-size:clamp(28px,7vw,36px);line-height:1.12;letter-spacing:-.045em;font-weight:800;text-wrap:balance;color:var(--card-ink)}.summary{margin:14px 0 0;font-size:15px;line-height:1.62;color:var(--card-ink);max-width:34em}.points{display:grid;gap:9px;margin:18px 0 0;padding:0;list-style:none}.points li{display:grid;grid-template-columns:7px 1fr;gap:9px;font-size:13px;line-height:1.5;color:var(--card-muted)}.points li:before{content:"";width:4px;height:4px;border-radius:50%;background:#8bc9c0;margin-top:.62em}.open-row{margin-top:20px;padding-top:14px;border-top:1px solid var(--card-line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:#e9efec}.open-row strong{font-size:11px;letter-spacing:.11em}.open-row span{font-size:17px;color:#9dcfc8}.gesture-label{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--ink);opacity:0;pointer-events:none}.gesture-label.next{right:18px}.gesture-label.save{left:18px;color:var(--teal)}
.browser{position:fixed;inset:0;z-index:20;background:#fff;color:#111;transform:translateX(102%);transition:transform 260ms cubic-bezier(.2,.8,.2,1);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.browser.open{transform:translateX(0)}.browser-bar{padding:calc(8px + var(--safe-top)) 10px 8px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,.1);background:rgba(250,250,248,.96);backdrop-filter:blur(18px)}.back{width:44px;height:44px;border:0;background:transparent;color:#0b665d;font-size:27px;display:grid;place-items:center}.source{min-width:0;text-align:center}.source strong,.source span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source strong{font-size:12px}.source span{font-size:10px;color:#73736f;margin-top:2px}.external{min-height:44px;display:grid;place-items:center;padding:0 8px;color:#0b665d;text-decoration:none;font-size:11px;font-weight:700}.browser-body{position:relative;min-height:0;background:#fff}.frame{width:100%;height:100%;border:0;background:#fff}.loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#777;font-size:12px;background:#fff;pointer-events:none}.browser.loaded .loading{display:none}.clear{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:28px}.clear.show{display:grid}.clear strong{display:block;font-size:44px;letter-spacing:.03em}.clear span{display:block;margin-top:10px;font-size:13px;color:var(--muted)}.clear button{margin-top:18px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);padding:11px 17px}
@media(max-height:690px){.card{height:min(77dvh,600px)}.title{font-size:26px}.summary{font-size:13.5px;line-height:1.5}.points{gap:6px;margin-top:13px}.points li{font-size:12px}.open-row{margin-top:14px}}
@media(max-width:350px){.card{width:96vw}.card-body{padding:16px 17px}.title{font-size:26px}.summary{font-size:13.5px}.points li{font-size:11.8px}}
@media(prefers-reduced-motion:reduce){.card,.browser{transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand">KAWASEMI</div><div class="lab">TAP SOURCE · V2</div></header>
  <main class="stage">
    <article class="card" id="card" aria-label="カード。タップでYahoo!ニュースを開く">
      <div class="hero"></div>
      <div class="card-body">
        <div class="meta"><span>YAHOO! NEWS</span><span>1 / 1</span></div>
        <div class="content">
          <div class="eyebrow">SOURCE TEST</div>
          <h1 class="title">カードをタップして、元記事を読む</h1>
          <p class="summary">CARDS内では長文をスクロールせず、要点だけを確認。詳しく読みたい時だけ参照元の記事を開く分岐テストです。</p>
          <ul class="points">
            <li>カード内の縦スクロールはなし</li>
            <li>左スワイプはNEXT、右スワイプはSAVE</li>
          </ul>
          <div class="open-row"><strong>TAP TO OPEN SOURCE</strong><span>↗</span></div>
        </div>
      </div>
    </article>
    <div class="gesture-label save" id="saveLabel">SAVE</div>
    <div class="gesture-label next" id="nextLabel">NEXT</div>
    <section class="clear" id="clear"><div><strong>CLEAR!</strong><span>テストカードを処理しました。</span><button id="restart">もう一度</button></div></section>
  </main>
</div>
<section class="browser" id="browser" aria-hidden="true">
  <div class="browser-bar">
    <button class="back" id="back" aria-label="KAWASEMIに戻る">‹</button>
    <div class="source"><strong>Yahoo!ニュース</strong><span>参照元を表示</span></div>
    <a class="external" id="external" href="https://news.yahoo.co.jp/pickup/6592556" target="_blank" rel="noopener noreferrer">元サイト ↗</a>
  </div>
  <div class="browser-body">
    <iframe class="frame" id="frame" title="Yahoo!ニュース"></iframe>
    <div class="loading" id="loading">Yahoo!ニュースを読み込み中…<br><br>表示されない場合は右上の「元サイト ↗」を使ってください。</div>
  </div>
</section>
<script>
(() => {
  const SOURCE_URL='https://news.yahoo.co.jp/pickup/6592556';
  const card=document.getElementById('card');
  const browser=document.getElementById('browser');
  const frame=document.getElementById('frame');
  const loading=document.getElementById('loading');
  const nextLabel=document.getElementById('nextLabel');
  const saveLabel=document.getElementById('saveLabel');
  const clear=document.getElementById('clear');
  let gesture=null,animating=false,browserOpen=false,done=false;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

  function resetCardVisual(){card.style.transition='transform 180ms cubic-bezier(.2,.75,.2,1),opacity 160ms linear';card.style.transform='';card.style.opacity='1';nextLabel.style.opacity='0';saveLabel.style.opacity='0';setTimeout(()=>card.style.transition='',190)}
  function openSource(){if(animating||done)return;browserOpen=true;browser.classList.add('open');browser.classList.remove('loaded');browser.setAttribute('aria-hidden','false');frame.src='about:blank';requestAnimationFrame(()=>{frame.src=SOURCE_URL});setTimeout(()=>browser.classList.add('loaded'),1400)}
  function closeSource(){browserOpen=false;browser.classList.remove('open');browser.setAttribute('aria-hidden','true');setTimeout(()=>{frame.src='about:blank';browser.classList.remove('loaded')},280)}
  function dismiss(dir){if(animating||done)return;animating=true;card.style.transition='transform 230ms cubic-bezier(.12,.82,.16,1),opacity 170ms linear';card.style.transform=`translate3d(${dir*118}vw,0,0) rotate(${dir*1.8}deg)`;card.style.opacity='.06';nextLabel.style.opacity='0';saveLabel.style.opacity='0';setTimeout(()=>{done=true;animating=false;card.style.display='none';clear.classList.add('show')},225)}

  card.addEventListener('pointerdown',e=>{if(browserOpen||animating||done||(e.button!==undefined&&e.button!==0))return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:false};card.setPointerCapture?.(e.pointerId)});
  card.addEventListener('pointermove',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.hypot(dx,dy)>8)g.moved=true;if(Math.abs(dx)<Math.abs(dy)*.72){card.style.transform='';nextLabel.style.opacity='0';saveLabel.style.opacity='0';return}e.preventDefault();const follow=clamp(dx,-190,190);card.style.transition='none';card.style.transform=`translate3d(${follow}px,0,0) rotate(${follow/260}deg)`;const p=clamp(Math.abs(dx)/100,0,1);nextLabel.style.opacity=dx<0?String(p):'0';saveLabel.style.opacity=dx>0?String(p):'0'},{passive:false});
  card.addEventListener('pointerup',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=Math.max(16,performance.now()-g.t),vx=dx/dt;if(!g.moved){card.style.transform='';openSource();return}const horizontal=Math.abs(dx)>Math.abs(dy)*.78;const commit=horizontal&&(Math.abs(dx)>=88||(Math.abs(dx)>=42&&Math.abs(vx)>=.6));if(commit){dismiss(dx>0?1:-1);return}resetCardVisual()});
  card.addEventListener('pointercancel',()=>{gesture=null;resetCardVisual()});
  document.getElementById('back').addEventListener('click',closeSource);
  document.getElementById('restart').addEventListener('click',()=>{done=false;clear.classList.remove('show');card.style.display='block';card.style.transition='none';card.style.transform='';card.style.opacity='1'});
})();
</script>
</body>
</html>
