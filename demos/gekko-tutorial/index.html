<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7F5F0">
<title>GEKKO 操作練習</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f7f5f0;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden}
button{font:inherit}
.app{height:100dvh;min-height:560px;position:relative;padding:max(20px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{height:74px;padding:18px 5.3vw 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
.brand{font-size:22px;font-weight:700;letter-spacing:.01em}.step{font-size:17px;color:#999}.skip{justify-self:end;border:0;background:none;color:#aaa;padding:2px 0;font-size:14px;min-width:44px;min-height:44px}
.hint{text-align:center;height:54px;padding-top:9px;font-size:16px;color:#777}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 48px 22px}
.deck{position:relative;width:min(78vw,350px);height:min(64vh,590px);max-height:calc(100dvh - 205px)}
.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#eeeae4;box-shadow:0 14px 34px rgba(0,0,0,.07);touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:50% 85%;will-change:transform,opacity}
.card:before,.card:after{content:"";position:absolute;inset:9px -6px -9px 6px;border-radius:28px;background:#e9e6df;z-index:-2}.card:after{inset:17px -10px -17px 10px;background:#e2ded6;z-index:-3}
.card img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.action{position:absolute;color:#c5c3bd;width:44px;height:44px;display:grid;place-items:center;pointer-events:none;z-index:20}.action svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.action-left{right:calc(100% + 4px);top:50%;transform:translateY(-50%)}
.action-right{left:calc(100% + 4px);top:50%;transform:translateY(-50%)}
.action-up{left:50%;bottom:calc(100% + 4px);transform:translateX(-50%)}
.done{position:absolute;inset:0;background:#f7f5f0;display:none;align-items:center;justify-content:center;padding:30px;z-index:40}.done.show{display:flex}.done-inner{text-align:center;width:min(100%,360px)}.done h1{font-size:24px;margin:0 0 34px;font-weight:600}.primary{width:100%;height:56px;border:0;border-radius:17px;background:#272622;color:white;font-weight:650;font-size:17px}.micro{margin-top:15px;color:#aaa;font-size:13px}
@media(max-width:340px){.stage{padding-left:43px;padding-right:43px}.deck{width:76vw}.brand{font-size:20px}.hint{font-size:15px}}
@media(prefers-reduced-motion:reduce){.card{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">be minimal</div><div class="step" id="step">1 / 3</div><button class="skip" id="skip">スキップ</button></header>
<div class="hint" id="hint">左へスワイプして削除</div>
<section class="stage"><div class="deck">
<div class="action action-left" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 9l.7 9h6.6L16 9"/></svg></div>
<div class="action action-right" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg></div>
<div class="action action-up" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a7 7 0 1 0 1 7"/><path d="M18 4v4h-4"/></svg></div>
<article class="card" id="card" role="group" aria-label="操作練習用写真"><img id="photo" alt="チュートリアル用レオパードゲッコー"></article>
</div></section>
<section class="done" id="done"><div class="done-inner"><h1>できました。</h1><button class="primary" id="start">写真を整理する</button><div class="micro">練習用の3枚だけを使っています。</div></div></section>
</main>
<script>
const photos=['tutorialPractice01.jpg','tutorialPractice02.jpg','tutorialPractice03.jpg'];
const required=['left','right','up'];
const labels=['左へスワイプして削除','右へスワイプして保持','上へスワイプして再検討'];
const shortLabels=['左へ','右へ','上へ'];
let i=0,startX=0,startY=0,dx=0,dy=0,drag=false;
const card=document.getElementById('card'),photo=document.getElementById('photo'),hint=document.getElementById('hint'),step=document.getElementById('step'),done=document.getElementById('done');
function load(){photo.src=photos[i];step.textContent=(i+1)+' / 3';hint.textContent=labels[i];card.style.transition='none';card.style.transform='';card.style.opacity='1'}
function finish(){done.classList.add('show')}
function restore(text){if(text)hint.textContent=text;card.style.transition='transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s';card.style.transform='';card.style.opacity='1'}
function resolve(dir){if(dir!==required[i]){restore(shortLabels[i]);setTimeout(()=>{if(!drag&&i<3)hint.textContent=labels[i]},700);return}
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const tx=dir==='left'?-760:dir==='right'?760:0,ty=dir==='up'?-760:0,rot=reduce?0:dir==='left'?-7:dir==='right'?7:0;
 card.style.transition=reduce?'opacity .08s':'transform .19s ease-out,opacity .19s';card.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg)`;card.style.opacity='.03';
 setTimeout(()=>{i++;if(i>=3)finish();else load()},reduce?85:195)}
function down(e){drag=true;startX=e.clientX;startY=e.clientY;dx=dy=0;card.setPointerCapture?.(e.pointerId)}
function move(e){if(!drag)return;dx=e.clientX-startX;dy=e.clientY-startY;const isUp=dy<0&&Math.abs(dy)>Math.abs(dx)*1.15;const x=isUp?dx*.18:dx;const y=isUp?dy:dy*.14;const rot=isUp?0:Math.max(-6.5,Math.min(6.5,x/27));card.style.transition='none';card.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`}
function up(){if(!drag)return;drag=false;let dir=null;if(dy<=-64&&Math.abs(dy)>Math.abs(dx)*1.05)dir='up';else if(dx<=-64)dir='left';else if(dx>=64)dir='right';if(dir)resolve(dir);else restore()}
card.addEventListener('pointerdown',down);card.addEventListener('pointermove',move);card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
document.getElementById('skip').onclick=finish;document.getElementById('start').onclick=()=>{i=0;done.classList.remove('show');load()};load();
</script>
</body></html>
