<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#F7F5F0"><title>GEKKO 操作練習</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f7f5f0;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden}button{font:inherit}.app{height:100dvh;min-height:560px;position:relative;padding:max(20px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:74px;padding:18px 5.3vw 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}.brand{font-size:22px;font-weight:700;letter-spacing:.01em}.step{font-size:17px;color:#999}.skip{justify-self:end;border:0;background:none;color:#aaa;padding:2px 0;font-size:14px}.hint{text-align:center;height:54px;padding-top:9px;font-size:16px;color:#777}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 44px 22px}.deck{position:relative;width:min(74vw,330px);height:min(62vh,570px);max-height:calc(100dvh - 205px)}.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#eeeae4;box-shadow:0 14px 34px rgba(0,0,0,.08);touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:50% 85%;will-change:transform,opacity}.card:before,.card:after{content:"";position:absolute;inset:9px -6px -9px 6px;border-radius:28px;background:#d9e6e5;z-index:-2}.card:after{inset:17px -10px -17px 10px;background:#c8dcdf;z-index:-3}.card img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}.action{position:absolute;color:#c5c3bd;width:44px;height:44px;display:grid;place-items:center;pointer-events:none}.action svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.left{right:calc(100% + 5px);top:50%;transform:translateY(-50%)}.right{left:calc(100% + 5px);top:50%;transform:translateY(-50%)}.done{position:absolute;inset:0;background:#f7f5f0;display:none;align-items:center;justify-content:center;padding:30px}.done.show{display:flex}.done-inner{text-align:center;width:min(100%,360px)}.done h1{font-size:26px;margin:0 0 34px}.primary{width:100%;height:58px;border:0;border-radius:18px;background:#272622;color:white;font-weight:700;font-size:17px}.micro{margin-top:15px;color:#aaa;font-size:13px}@media(max-width:340px){.stage{padding-left:39px;padding-right:39px}.deck{width:74vw}.brand{font-size:20px}.hint{font-size:15px}}@media(prefers-reduced-motion:reduce){.card{transition:none!important}}</style></head><body><main class="app" id="app"><header class="top"><div class="brand">be minimal</div><div class="step" id="step">1 / 3</div><button class="skip" id="skip">スキップ</button></header><div class="hint" id="hint">右へスワイプして残す</div><section class="stage"><div class="deck"><div class="action left" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 9l.7 9h6.6L16 9"/></svg></div><div class="action right" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg></div><article class="card" id="card" role="group" aria-label="操作練習用写真"><img id="photo" alt="チュートリアル用レオパードゲッコー"><div></div></article></div></section><section class="done" id="done"><div class="done-inner"><h1>できました。</h1><button class="primary" id="start">写真を整理する</button><div class="micro">これは操作練習です。実際の写真は変更されません。</div></div></section></main><script>const photos=['../be-minimal/tutorialPractice01.jpg','../be-minimal/tutorialPractice02.jpg','../be-minimal/tutorialPractice03.jpg'];let i=0,x=0,startX=0,drag=false;const card=document.getElementById('card'),photo=document.getElementById('photo'),hint=document.getElementById('hint'),step=document.getElementById('step'),done=document.getElementById('done');function load(){photo.src=photos[i];step.textContent=(i+1)+' / 3';hint.textContent=i===0?'右へスワイプして残す':i===1?'左へスワイプして削除':'どっちにする？';card.style.transition='none';card.style.transform='';card.style.opacity='1'}function finish(){done.classList.add('show')}function resolve(dir){const ok=i===2||(i===0&&dir==='right')||(i===1&&dir==='left');if(!ok){hint.textContent=i===0?'右へ':'左へ';card.style.transition='transform .28s cubic-bezier(.2,.8,.2,1)';card.style.transform='';return}card.style.transition='transform .19s ease-out,opacity .19s';card.style.transform=`translateX(${dir==='right'?760:-760}px) rotate(${dir==='right'?7:-7}deg)`;card.style.opacity='.03';setTimeout(()=>{i++;if(i>=3)finish();else load()},195)}function down(e){drag=true;startX=e.clientX;x=0;card.setPointerCapture?.(e.pointerId)}function move(e){if(!drag)return;x=e.clientX-startX;card.style.transition='none';card.style.transform=`translateX(${x}px) rotate(${Math.max(-6.5,Math.min(6.5,x/27))}deg)`}function up(){if(!drag)return;drag=false;if(Math.abs(x)>=64)resolve(x>0?'right':'left');else{card.style.transition='transform .28s cubic-bezier(.2,.8,.2,1)';card.style.transform=''}}card.addEventListener('pointerdown',down);card.addEventListener('pointermove',move);card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);document.getElementById('skip').onclick=finish;document.getElementById('start').onclick=()=>{i=0;done.classList.remove('show');load()};load();</script></body></html>
