<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>be minimal — storage test</title>
<style>
:root{
  --bg:#F7F5F0;
  --surface:#FBFAF7;
  --text:#171714;
  --muted:#9A968F;
  --line:rgba(23,23,20,.08);
  --track:#EAE6DF;
  --fill:#8E8A84;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#151513;--surface:#1D1D1A;--text:#F1EFE9;--muted:#97938C;--line:rgba(255,255,255,.08);--track:#2A2925;--fill:#B8B4AD}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit}
.screen{min-height:100dvh;padding:calc(28px + var(--safe-top)) 26px calc(34px + var(--safe-bottom));max-width:480px;margin:0 auto}
.brand{font-size:18px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin:34px 0 84px}
.view{display:none}.view.active{display:block}
.headline{font-size:35px;line-height:1.18;letter-spacing:-.045em;font-weight:500;margin:0 0 24px}
.counts{display:grid;gap:9px;font-size:16px;color:var(--muted);letter-spacing:.01em}
.hero{margin-top:54px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-value{font-size:62px;line-height:.9;letter-spacing:-.065em;font-weight:560;font-variant-numeric:tabular-nums}
.hero-unit{font-size:24px;letter-spacing:-.02em}
.hero-copy{font-size:18px;color:var(--text);margin-left:2px}
.storage-card{margin-top:50px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:24px 22px 22px;box-shadow:0 18px 42px rgba(44,40,34,.045)}
.storage-title{font-size:17px;font-weight:520;margin-bottom:24px}
.bar{height:9px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;width:78%;background:var(--fill);border-radius:inherit}
.before-after{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:25px}
.storage-point{text-align:center}.storage-point small{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.storage-point strong{font-size:17px;font-weight:520;font-variant-numeric:tabular-nums;white-space:nowrap}.arrow{font-size:21px;color:var(--muted);font-weight:300}
.gain{border-top:1px solid var(--line);margin-top:22px;padding-top:20px;text-align:center;color:var(--muted);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.cumulative{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:25px;padding:22px 24px}
.cumulative-label{font-size:13px;color:var(--muted);margin-bottom:7px}.cumulative-value{font-size:25px;font-weight:500;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.cumulative-value span{font-size:15px;color:var(--muted);font-weight:400}
.quiet-note{margin:56px auto 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.75;max-width:290px}
.switch-link{margin:42px auto 0;border:0;background:transparent;display:block;min-height:44px;padding:10px 12px;color:var(--muted);font-size:14px;text-decoration:underline;text-decoration-color:rgba(154,150,143,.45);text-underline-offset:6px}
.home-wrap{padding-top:112px}.section-label{font-size:18px;color:var(--muted);margin-bottom:22px;letter-spacing:.02em}
.home-card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:27px 24px;box-shadow:0 18px 42px rgba(44,40,34,.045)}
.home-free{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}.home-free strong{font-size:54px;line-height:1;letter-spacing:-.06em;font-weight:560;font-variant-numeric:tabular-nums}.home-free span{font-size:20px}
.home-reclaimed{margin-top:18px;color:var(--muted);font-size:15px}.home-card .bar{margin-top:23px;height:8px}
.home-last{margin-top:22px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.loop{font-size:21px;line-height:1}
@media(max-width:360px){
  .screen{padding-left:20px;padding-right:20px}.brand{margin-bottom:68px}.headline{font-size:31px}.hero{margin-top:46px}.hero-value{font-size:54px}.hero-unit{font-size:21px}.hero-copy{font-size:16px}.storage-card{margin-top:42px;padding-left:18px;padding-right:18px}.storage-point strong{font-size:15px}.before-after{gap:8px}.home-free strong{font-size:48px}
}
@media(prefers-reduced-motion:no-preference){.view.active{animation:fade .18s ease}@keyframes fade{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="screen">
  <div class="brand">be minimal</div>

  <section class="view active" id="outcomeView">
    <h1 class="headline">今日もすっきり。</h1>
    <div class="counts" aria-label="今回の整理結果">
      <span>127枚 整理</span>
      <span>73枚 削除</span>
    </div>

    <div class="hero" aria-label="1.8ギガバイト取り戻しました">
      <span class="hero-value">1.8</span>
      <span class="hero-unit">GB</span>
      <span class="hero-copy">取り戻しました</span>
    </div>

    <section class="storage-card" aria-label="iPhoneストレージ">
      <div class="storage-title">iPhoneストレージ</div>
      <div class="bar" role="progressbar" aria-label="整理後のストレージ使用状況" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"><span></span></div>
      <div class="before-after">
        <div class="storage-point"><small>整理前</small><strong>18.2 GB FREE</strong></div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="storage-point"><small>整理後</small><strong>20.0 GB FREE</strong></div>
      </div>
      <div class="gain">+1.8 GB</div>
    </section>

    <section class="cumulative" aria-label="GEKKO累計 12.6ギガバイト">
      <div class="cumulative-label">GEKKO累計</div>
      <div class="cumulative-value">12.6 GB <span>reclaimed</span></div>
    </section>

    <p class="quiet-note">自分の操作で、iPhoneが少し軽くなった。</p>
    <button class="switch-link" id="showHome" type="button">ホーム用表示を見る</button>
  </section>

  <section class="view" id="homeView">
    <div class="home-wrap">
      <div class="section-label">ストレージ</div>
      <section class="home-card" aria-label="20ギガバイト空き。GEKKOで累計12.6ギガバイト取り戻しました">
        <div class="home-free"><strong>20.0</strong><span>GB FREE</span></div>
        <div class="home-reclaimed">GEKKOで 12.6 GB 取り戻しました</div>
        <div class="bar" aria-hidden="true"><span></span></div>
        <div class="home-last"><span class="loop" aria-hidden="true">↻</span><span>前回整理 +1.8 GB</span></div>
      </section>
      <button class="switch-link" id="showOutcome" type="button">整理完了画面に戻る</button>
    </div>
  </section>
</main>
<script>
const outcome=document.getElementById('outcomeView');
const home=document.getElementById('homeView');
function show(name){
  const isOutcome=name==='outcome';
  outcome.classList.toggle('active',isOutcome);
  home.classList.toggle('active',!isOutcome);
  window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
document.getElementById('showHome').addEventListener('click',()=>show('home'));
document.getElementById('showOutcome').addEventListener('click',()=>show('outcome'));
</script>
</body>
</html>
