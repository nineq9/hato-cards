<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f3ed">
<meta name="color-scheme" content="light">
<title>be minimal</title>
<style>
:root{--bg:#f6f3ed;--surface:#fbfaf7;--ink:#1f1e1b;--muted:#858078;--line:rgba(31,30,27,.11);--keep:#8f9a83;--glass:rgba(20,20,18,.36);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid rgba(31,30,27,.55);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:calc(56px + var(--safe-top)) minmax(0,1fr) calc(68px + var(--safe-bottom));overflow:hidden}.topbar{padding:var(--safe-top) 18px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{justify-self:start;font-size:17px;font-weight:520;letter-spacing:.06em}.progress{justify-self:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}.review-button{justify-self:end;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;opacity:.8}.review-dot{width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:-7px 0 0 rgba(31,30,27,.25),7px 0 0 rgba(31,30,27,.25)}
.stage{min-height:0;position:relative;display:grid;align-items:center;overflow:hidden}.film{width:100%;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:10vw;padding:16px 12vw 22px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}.film::-webkit-scrollbar{display:none}
.card{flex:0 0 76vw;height:min(68vh,650px);min-height:420px;position:relative;scroll-snap-align:center;scroll-snap-stop:always;border-radius:28px;overflow:hidden;background:#d8d3ca;box-shadow:0 12px 38px rgba(38,33,27,.09);transform:translate3d(0,0,0);will-change:transform,opacity;touch-action:pan-x;user-select:none}.card::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);border-radius:inherit}.photo{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.card-meta{position:absolute;right:13px;bottom:13px;display:flex;align-items:center;gap:8px;pointer-events:none}.heart{font-size:20px;line-height:1;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.28)}.size{height:30px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);color:#fff;font-size:12px;font-weight:520;font-variant-numeric:tabular-nums}.signal{width:15px;height:13px;display:flex;align-items:flex-end;gap:2px}.signal i{display:block;width:3px;border-radius:2px;background:currentColor}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:12px}
.keep-cue{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);width:50px;height:50px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(247,246,242,.89);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 5px 18px rgba(20,18,15,.11);z-index:4;transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s ease}.keep-cue::before{content:"";width:10px;height:10px;border-top:1.8px solid var(--ink);border-left:1.8px solid var(--ink);transform:translateY(3px) rotate(45deg)}.card.is-dragging .keep-cue{transform:translateX(-50%) translateY(-6px) scale(1.04)}.keep-indicator{position:absolute;left:50%;top:15px;transform:translate(-50%,-6px) scale(.92);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(44,50,39,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .10s linear,transform .10s linear}.keep-indicator::before{content:"";width:10px;height:10px;border-top:2px solid currentColor;border-left:2px solid currentColor;transform:translateY(3px) rotate(45deg)}.card.is-dragging .keep-indicator{opacity:1;transform:translate(-50%,0) scale(1)}
.bottom{padding:0 18px var(--safe-bottom);display:flex;align-items:center;justify-content:center}.hairline{width:42px;height:4px;border-radius:999px;background:rgba(31,30,27,.13)}.empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:36px}.empty.show{display:grid}.empty-mark{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px}.empty-mark::before{content:"";width:16px;height:9px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}.empty p{margin:0;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-bottom));z-index:90;min-width:44px;height:44px;padding:0 14px;border-radius:999px;background:rgba(31,30,27,.92);color:#fff;display:flex;align-items:center;justify-content:center;transform:translate(-50%,16px) scale(.96);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .26s cubic-bezier(.2,.8,.2,1);font-size:12px;letter-spacing:.05em}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden}.viewer.show{display:block}.viewer-media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.viewer-close{position:absolute;z-index:2;left:12px;top:calc(10px + var(--safe-top));width:44px;height:44px;border:0;border-radius:50%;background:rgba(30,30,30,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;color:#fff}.viewer-close::before,.viewer-close::after{content:"";position:absolute;width:17px;height:1.5px;border-radius:2px;background:currentColor}.viewer-close::before{transform:rotate(45deg)}.viewer-close::after{transform:rotate(-45deg)}.viewer-meta{position:absolute;right:13px;bottom:calc(12px + var(--safe-bottom));display:flex;align-items:center;gap:8px}
.backdrop{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity .18s ease}.backdrop.show{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:120;left:0;right:0;bottom:0;max-height:56dvh;padding:9px 18px calc(18px + var(--safe-bottom));border-radius:24px 24px 0 0;background:rgba(249,248,244,.97);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);box-shadow:0 -14px 44px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.sheet.show{transform:translateY(0)}.sheet-handle{width:36px;height:5px;border-radius:999px;background:rgba(31,30,27,.17);margin:0 auto 18px}.detail-date{font-size:20px;font-weight:610;letter-spacing:-.02em}.detail-place{margin-top:5px;color:var(--muted);font-size:14px}.neighbors{display:flex;gap:8px;overflow-x:auto;padding:20px 0 4px;scrollbar-width:none}.neighbors::-webkit-scrollbar{display:none}.neighbor{flex:0 0 74px;height:74px;border-radius:12px;object-fit:cover;background:#ddd}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}.toast,.sheet,.keep-cue,.keep-indicator{transition:none!important}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand">be minimal</div><div class="progress" id="progress">1 / 5</div><button class="review-button" type="button" aria-label="削除候補を確認"><span class="review-dot" aria-hidden="true"></span></button></header><main class="stage"><div class="film" id="film" aria-label="写真を選ぶ"></div><div class="empty" id="empty"><div><div class="empty-mark"></div><p>0 MB</p></div></div></main><footer class="bottom"><div class="hairline" aria-hidden="true"></div></footer></div>
<div class="toast" id="toast" role="status" aria-live="polite">KEEP</div>
<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="写真を全画面表示"><img class="viewer-media" id="viewerMedia" alt=""><button class="viewer-close" id="viewerClose" type="button" aria-label="閉じる"></button><div class="viewer-meta" id="viewerMeta"></div></section>
<div class="backdrop" id="backdrop"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="写真の詳細"><div class="sheet-handle"></div><div class="detail-date" id="detailDate">2026年8月16日 09:41</div><div class="detail-place" id="detailPlace">Belgrade, Serbia</div><div class="neighbors" id="neighbors"></div></section>
<script>
const items=[{src:'https://picsum.photos/id/1025/1000/1400',size:'1.2 MB',fav:false,date:'2026年8月16日 09:41',place:'Belgrade, Serbia'},{src:'https://picsum.photos/id/1062/1000/1400',size:'820 KB',fav:true,date:'2026年7月28日 18:12',place:'Paris, France'},{src:'https://picsum.photos/id/1069/1000/1400',size:'3.8 MB',fav:false,date:'2026年7月11日 14:05',place:'Struga, North Macedonia'},{src:'https://picsum.photos/id/1084/1000/1400',size:'2.1 MB',fav:false,date:'2026年6月30日 20:17',place:'Ohrid, North Macedonia'},{src:'https://picsum.photos/id/1074/1000/1400',size:'5.4 MB',fav:false,date:'2026年6月18日 10:02',place:'Skopje, North Macedonia'}];
const film=document.getElementById('film'),progress=document.getElementById('progress'),empty=document.getElementById('empty'),toast=document.getElementById('toast'),viewer=document.getElementById('viewer'),viewerMedia=document.getElementById('viewerMedia'),viewerClose=document.getElementById('viewerClose'),viewerMeta=document.getElementById('viewerMeta'),backdrop=document.getElementById('backdrop'),sheet=document.getElementById('sheet'),detailDate=document.getElementById('detailDate'),detailPlace=document.getElementById('detailPlace'),neighbors=document.getElementById('neighbors');const kept=new Set();let activeIndex=0,toastTimer;
function signalMarkup(){return '<span class="signal" aria-hidden="true"><i></i><i></i><i></i></span>'}function metaMarkup(item){return `${item.fav?'<span class="heart" aria-label="お気に入り">♥</span>':''}<span class="size">${signalMarkup()}${item.size}</span>`}
function render(){film.innerHTML='';items.forEach((item,index)=>{if(kept.has(index))return;const card=document.createElement('article');card.className='card';card.dataset.index=index;card.setAttribute('aria-label',`${index+1}枚目の写真`);card.innerHTML=`<img class="photo" src="${item.src}" alt=""><div class="keep-indicator" aria-hidden="true"></div><button class="keep-cue" type="button" aria-label="この写真を残す"></button><div class="card-meta">${metaMarkup(item)}</div>`;film.appendChild(card);wireCard(card)});empty.classList.toggle('show',film.children.length===0);requestAnimationFrame(updateProgress)}
function visibleCards(){return[...film.querySelectorAll('.card')]}function nearestCard(){const cards=visibleCards();if(!cards.length)return null;const center=window.innerWidth/2;return cards.reduce((best,card)=>{const r=card.getBoundingClientRect(),d=Math.abs((r.left+r.right)/2-center);return!best||d<best.d?{card,d}:best},null).card}function updateProgress(){const card=nearestCard();if(!card){progress.textContent=`${items.length} / ${items.length}`;return}activeIndex=Number(card.dataset.index);progress.textContent=`${activeIndex+1} / ${items.length}`}film.addEventListener('scroll',()=>requestAnimationFrame(updateProgress),{passive:true});
function showToast(){clearTimeout(toastTimer);toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),520);if(navigator.vibrate)navigator.vibrate(8)}
function keepCard(card,releaseVelocity=0){const index=Number(card.dataset.index);if(kept.has(index))return;const distance=Math.max(window.innerHeight*.86,620),duration=releaseVelocity<-.8?220:300;card.style.pointerEvents='none';showToast();const anim=card.animate([{transform:card.style.transform||'translate3d(0,0,0) scale(1)',opacity:1},{transform:`translate3d(0,-${distance}px,0) scale(.985)`,opacity:.08}],{duration,easing:'cubic-bezier(.20,.75,.18,1)',fill:'forwards'});anim.onfinish=()=>{kept.add(index);render();const next=visibleCards()[0];if(next)next.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}}
function restoreCard(card){const from=card.style.transform||'translate3d(0,0,0)';const anim=card.animate([{transform:from},{transform:'translate3d(0,7px,0) scale(.998)'},{transform:'translate3d(0,0,0) scale(1)'}],{duration:330,easing:'cubic-bezier(.20,.75,.18,1)'});anim.onfinish=()=>{card.style.transform=''}}
function wireCard(card){const keepButton=card.querySelector('.keep-cue');keepButton.addEventListener('click',e=>{e.stopPropagation();keepCard(card)});let startX=0,startY=0,lastY=0,startTime=0,lastTime=0,direction='pending',moved=false,longPressed=false,longTimer=null;card.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];startX=t.clientX;startY=t.clientY;lastY=t.clientY;startTime=performance.now();lastTime=startTime;direction='pending';moved=false;longPressed=false;longTimer=setTimeout(()=>{if(!moved){longPressed=true;openDetails(Number(card.dataset.index))}},480)},{passive:true});card.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-startX,dy=t.clientY-startY,ax=Math.abs(dx),ay=Math.abs(dy);if(ax>7||ay>7){moved=true;clearTimeout(longTimer)}if(direction==='pending'&&(ax>9||ay>9)){if(dy<0&&ay>ax*.82)direction='vertical';else if(ax>ay*.92)direction='horizontal';else direction='none'}if(direction==='vertical'){e.preventDefault();const pull=Math.min(0,dy),p=Math.min(1,Math.abs(pull)/120);card.classList.add('is-dragging');card.style.transform=`translate3d(0,${pull*.92}px,0) scale(${1-p*.012})`;card.style.boxShadow=`0 ${12+p*8}px ${38+p*18}px rgba(38,33,27,${.09+p*.05})`}lastY=t.clientY;lastTime=performance.now()},{passive:false});card.addEventListener('touchend',()=>{clearTimeout(longTimer);card.classList.remove('is-dragging');card.style.boxShadow='';const elapsed=Math.max(1,lastTime-startTime),dy=lastY-startY,velocity=dy/elapsed;if(direction==='vertical'){if(dy<-52||(dy<-26&&velocity<-.32))keepCard(card,velocity);else restoreCard(card);return}if(!moved&&!longPressed&&performance.now()-startTime<380)openViewer(Number(card.dataset.index))},{passive:true});card.addEventListener('touchcancel',()=>{clearTimeout(longTimer);card.classList.remove('is-dragging');card.style.boxShadow='';restoreCard(card)},{passive:true});card.addEventListener('click',e=>{if(e.target.closest('.keep-cue'))return;if(!('ontouchstart'in window))openViewer(Number(card.dataset.index))})}
function openViewer(index){const item=items[index];viewerMedia.src=item.src;viewerMeta.innerHTML=metaMarkup(item);viewer.classList.add('show');document.body.style.overflow='hidden'}function closeViewer(){viewer.classList.remove('show');viewerMedia.removeAttribute('src')}viewerClose.addEventListener('click',closeViewer);viewer.addEventListener('click',e=>{if(e.target===viewerMedia)closeViewer()});
function openDetails(index){const item=items[index];detailDate.textContent=item.date;detailPlace.textContent=item.place;neighbors.innerHTML='';[index-2,index-1,index,index+1,index+2].filter(i=>i>=0&&i<items.length).forEach(i=>{const img=document.createElement('img');img.className='neighbor';img.src=items[i].src;img.alt='';neighbors.appendChild(img)});backdrop.classList.add('show');sheet.classList.add('show');if(navigator.vibrate)navigator.vibrate(5)}function closeDetails(){backdrop.classList.remove('show');sheet.classList.remove('show')}backdrop.addEventListener('click',closeDetails);render();
</script>
</body>
</html>
