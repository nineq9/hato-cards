name: Issue 4 branch patch

on:
  push:
    branches: [issue-4-cards-human-e2e]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-4-cards-human-e2e
      - name: Apply deterministic patch
        run: python3 scripts/issue4_patch.py
      - name: Verify syntax
        run: node --check kingfisher.js
      - name: Commit patched production files
        run: |
          if git diff --quiet -- kingfisher.js kingfisher.css; then
            echo "No production diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kingfisher.js kingfisher.css
          git commit -m "Fix Issue #4 gesture direction lock and menu edge recovery"
          git push origin HEAD:issue-4-cards-human-e2e
