name: Issue 4 final branch patch

on:
  push:
    branches: [issue-4-cards-human-e2e]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-4-cards-human-e2e
      - name: Apply confirmed regression fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('kingfisher.js')
          s=js.read_text()
          old="const theme=e.target.closest('[data-theme]');"
          new="const theme=e.target.closest('button[data-theme]');"
          assert old in s
          s=s.replace(old,new,1)
          old="const language=e.target.closest('[data-lang]');"
          new="const language=e.target.closest('button[data-lang]');"
          assert old in s
          s=s.replace(old,new,1)
          js.write_text(s)

          css=Path('kingfisher.css')
          c=css.read_text()
          old='.drawer.open{transform:translateX(0)}'
          new='.drawer.open{transform:translateX(0)}.drawer:not(.open){pointer-events:none}'
          assert old in c
          css.write_text(c.replace(old,new,1))
          PY
      - name: Verify syntax
        run: node --check kingfisher.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/issue4-final-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kingfisher.js kingfisher.css .github/workflows/issue4-final-patch.yml
          git commit -m "Fix Issue #4 drawer hit testing and settings delegation"
          git push origin HEAD:issue-4-cards-human-e2e
