name: Demo visual QA audit

on:
  workflow_dispatch:
  push:
    branches:
      - visual-qa-audit-20260816
    paths:
      - 'tests/demo-visual-audit.mjs'
      - 'tests/day2-visual-guard.mjs'
      - '.github/workflows/demo-visual-audit.yml'
      - 'demos/day2-baseline/**'
      - 'demos/live-trace/**'
      - 'demos/dive-focus-map/**'
      - 'index.html'
      - 'kingfisher.css'
      - 'kingfisher.js'
  pull_request:
    branches: [main]
    paths:
      - 'tests/demo-visual-audit.mjs'
      - 'tests/day2-visual-guard.mjs'
      - '.github/workflows/demo-visual-audit.yml'
      - 'demos/day2-baseline/**'
      - 'docs/status/DESIGN.md'
      - 'docs/status/LIVE.md'
      - 'docs/status/DIVE.md'
      - 'docs/DEMO_VISUAL_QA_2026-08-16.md'

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check tests/demo-visual-audit.mjs
          node --check tests/day2-visual-guard.mjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve repository
        run: |
          python3 -m http.server 4173 >/tmp/demo-visual-audit-http.log 2>&1 &
          echo $! > /tmp/demo-visual-audit-http.pid
          sleep 2
      - name: Day 2 visual overlap guard
        run: node tests/day2-visual-guard.mjs
      - name: Capture viewport matrix and layout report
        run: node tests/demo-visual-audit.mjs
      - name: Upload visual audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-visual-audit
          path: test-output/demo-visual-audit/**
          if-no-files-found: error
