name: KINGFISHER smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check kingfisher.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/kingfisher-http.log 2>&1 &
          echo $! > /tmp/kingfisher-http.pid
          sleep 2
      - name: Browser smoke
        run: node tests/smoke.mjs
      - name: Upload visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingfisher-visual-checks
          path: test-output/*.png
          if-no-files-found: ignore
