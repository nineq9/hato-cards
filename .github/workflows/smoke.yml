name: KINGFISHER smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kingfisher-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check kingfisher.js
          node --check demos/live-trace/live-trace.js
          node --check tests/smoke.mjs
          node --check tests/mobile-e2e.mjs
          node --check tests/untouched-regression.mjs
          node --check tests/live-trace-demo.mjs
          node --check tests/live-trace-visual.mjs
          node --check tests/ai-data-contract.mjs
          node --check prototypes/ai-data-v0.1/govuk-content-adapter.mjs
          node --check prototypes/ai-data-v0.1/contract-validation.mjs
      - name: AI Data contract fixture
        run: node tests/ai-data-contract.mjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/kingfisher-http.log 2>&1 &
          echo $! > /tmp/kingfisher-http.pid
          sleep 2
      - name: Browser smoke
        run: node tests/smoke.mjs
      - name: Human-like mobile E2E
        if: always()
        run: node tests/mobile-e2e.mjs
      - name: Untouched feature regression
        if: always()
        run: node tests/untouched-regression.mjs
      - name: LIVE TRACE demo E2E
        if: always()
        run: node tests/live-trace-demo.mjs
      - name: LIVE TRACE visual consistency matrix
        if: always()
        run: node tests/live-trace-visual.mjs
      - name: Upload visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingfisher-visual-checks
          path: test-output/*.png
          if-no-files-found: ignore
