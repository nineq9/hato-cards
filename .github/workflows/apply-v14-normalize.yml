name: Apply KINGFISHER v14 normalization
on:
  push:
    paths:
      - '.github/workflows/apply-v14-normalize.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize runtime
        run: |
          python3 scripts/normalize_v14.py
          node --check kingfisher.js
      - name: Commit runtime change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kingfisher.js
          if ! git diff --cached --quiet; then
            git commit -m "Normalize KINGFISHER v14 detail rendering"
            git push
          fi
