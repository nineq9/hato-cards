name: HATO hourly news

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hato-hourly.yml'
      - 'scripts/hato_hourly.py'
      - 'scripts/hato_hourly_v2.py'

permissions:
  contents: write

concurrency:
  group: hato-hourly-news
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair collector base and apply hourly limit
        shell: bash
        run: |
          set -euo pipefail
          git show 7f5e7ea38ef071d6815922b8bcf8590269e89568:scripts/hato_hourly.py > scripts/hato_hourly.py
          sed -i 's/MAX_HOURLY_ADDS = 5/MAX_HOURLY_ADDS = 10/' scripts/hato_hourly.py
          if ! git diff --quiet -- scripts/hato_hourly.py; then
            git config user.name 'hato-maintenance-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/hato_hourly.py
            git commit -m 'Set HATO hourly breaking-news limit to 10'
            git push origin HEAD:main
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous HATO live state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hato-live
          mkdir -p hato-media/data
          if git show origin/hato-live:hato-media/data/news-state.json > hato-media/data/news-state.json 2>/dev/null; then
            echo 'Restored previous state.'
          else
            printf '%s\n' '{"edition_date":null,"last_run_at":null,"candidates":[],"articles":[]}' > hato-media/data/news-state.json
          fi

      - name: Collect, deduplicate and select HATO news
        run: python scripts/hato_hourly_v2.py

      - name: Validate live data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('hato-media/data/live-articles.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          articles=data.get('articles', [])
          assert isinstance(articles, list)
          assert 12 <= len(articles) <= 50, f'unsafe edition size: {len(articles)}'
          ids=[int(a['id']) for a in articles]
          assert len(ids) == len(set(ids))
          for a in articles:
              assert a.get('title') and a.get('category') and a.get('summary')
          print(f'validated {len(articles)} published stories')
          PY

      - name: Publish data to hato-live branch
        shell: bash
        run: |
          set -euo pipefail
          cp hato-media/data/live-articles.json /tmp/hato-live-articles.json
          cp hato-media/data/news-state.json /tmp/hato-news-state.json
          rm -rf hato-media/data

          git fetch origin hato-live
          git switch -C hato-live origin/hato-live
          mkdir -p hato-media/data
          cp /tmp/hato-live-articles.json hato-media/data/live-articles.json
          cp /tmp/hato-news-state.json hato-media/data/news-state.json

          git config user.name 'hato-news-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hato-media/data/live-articles.json hato-media/data/news-state.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m "HATO hourly news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin hato-live
