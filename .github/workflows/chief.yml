name: KINGFISHER chief

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  workflow_run:
    workflows: ["KINGFISHER smoke"]
    types: [completed]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: kingfisher-chief-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  pr-intake:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Register work with Chief
        uses: actions/github-script@v7
        with:
          script: |
            const CONTROL_ISSUE = 1;
            const pr = context.payload.pull_request;
            const marker = '<!-- asumi-chief:pr-state -->';

            async function upsertPrComment(body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }

            async function updateControl(statusBlock) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: CONTROL_ISSUE,
              });
              const start = '<!-- asumi-chief:status:start -->';
              const end = '<!-- asumi-chief:status:end -->';
              const body = issue.data.body || '';
              const replacement = `${start}\n${statusBlock}\n${end}`;
              const startAt = body.indexOf(start);
              const endAt = body.indexOf(end);
              const nextBody = startAt >= 0 && endAt > startAt
                ? body.slice(0, startAt) + replacement + body.slice(endAt + end.length)
                : replacement + '\n\n' + body;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: CONTROL_ISSUE,
                body: nextBody,
              });
            }

            await upsertPrComment(`${marker}\n## Chief\n- State: QA_QUEUED\n- PR: #${pr.number} — ${pr.title}\n- Next automatic step: KINGFISHER smoke\n- Owner action: none\n\nChief will use automated QA results before asking for human attention.`);

            await updateControl(`## Current status\n- Phase: Event-driven development\n- State: WAITING_EXTERNAL\n- Current task: PR #${pr.number} — ${pr.title}\n- Owner action: none\n- Next automatic step: run KINGFISHER smoke`);

  qa-route:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Route QA result
        uses: actions/github-script@v7
        with:
          script: |
            const CONTROL_ISSUE = 1;
            const run = context.payload.workflow_run;
            const marker = '<!-- asumi-chief:pr-state -->';
            const prs = run.pull_requests || [];
            const pr = prs[0];
            const passed = run.conclusion === 'success';

            async function updateControl(statusBlock) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: CONTROL_ISSUE,
              });
              const start = '<!-- asumi-chief:status:start -->';
              const end = '<!-- asumi-chief:status:end -->';
              const body = issue.data.body || '';
              const replacement = `${start}\n${statusBlock}\n${end}`;
              const startAt = body.indexOf(start);
              const endAt = body.indexOf(end);
              const nextBody = startAt >= 0 && endAt > startAt
                ? body.slice(0, startAt) + replacement + body.slice(endAt + end.length)
                : replacement + '\n\n' + body;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: CONTROL_ISSUE,
                body: nextBody,
              });
            }

            async function notifyOwner(title, detail) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: CONTROL_ISSUE,
                body: `@${context.repo.owner} **${title}**\n\n${detail}`,
              });
            }

            async function dispatchWorker(taskType, taskRef) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'kingfisher-worker',
                client_payload: { task_type: taskType, task_ref: taskRef },
              });
            }

            if (pr) {
              const state = passed ? 'AUTOMATED_QA_PASS' : 'REWORKING';
              const next = passed
                ? 'Product/UX review via worker adapter'
                : 'Build diagnosis/rework via worker adapter';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
              const body = `${marker}\n## Chief\n- State: ${state}\n- Automated QA: ${passed ? 'PASS' : `FAIL (${run.conclusion || 'unknown'})`}\n- Run: ${run.html_url}\n- Next: ${next}\n- Owner action: none unless the worker adapter reaches a policy gate`;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              await updateControl(`## Current status\n- Phase: Event-driven development\n- State: ${state}\n- Current task: PR #${pr.number}\n- Automated QA: ${passed ? 'PASS' : `FAIL (${run.conclusion || 'unknown'})`}\n- Owner action: none\n- Next automatic step: ${next}`);
              await dispatchWorker(passed ? 'product-review' : 'rework', `PR #${pr.number}`);
            } else if (passed) {
              await updateControl(`## Current status\n- Phase: Main-branch verification\n- State: DONE\n- Current task: main branch ${run.head_sha.slice(0, 7)}\n- Automated QA: PASS\n- Owner action: none\n- Next automatic step: continue roadmap`);
              await notifyOwner('Chief stage completed', `Main-branch QA passed for \`${run.head_sha.slice(0, 7)}\`. Chief is healthy and can continue the roadmap. No action is required from you.`);
            } else {
              await updateControl(`## Current status\n- Phase: Main-branch verification\n- State: REWORKING\n- Current task: main branch ${run.head_sha.slice(0, 7)}\n- Automated QA: FAIL (${run.conclusion || 'unknown'})\n- Owner action: none yet\n- Next automatic step: diagnose regression via worker adapter`);
              await dispatchWorker('diagnose', `main ${run.head_sha.slice(0, 7)}`);
            }
