name: Apply Issue 25 patch

on:
  push:
    branches: [cards-owner-swipe-menu-v2]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'cards-owner-swipe-menu-v2' && github.actor != 'github-actions[bot]' || github.ref == 'refs/heads/cards-owner-swipe-menu-v2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cards-owner-swipe-menu-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch helper labels
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('.github/scripts/issue25_patch.py')
          s=p.read_text()
          tree=ast.parse(s)
          lines=s.splitlines(keepends=True)
          starts=[]; total=0
          for line in lines:
            starts.append(total); total+=len(line)
          edits=[]
          for node in ast.walk(tree):
            if not isinstance(node,ast.Call) or not isinstance(node.func,ast.Name): continue
            need=None
            if node.func.id=='once' and len(node.args)==3: need='auto once'
            if node.func.id=='between' and len(node.args)==4: need='auto between'
            if not need: continue
            pos=starts[node.end_lineno-1]+node.end_col_offset-1
            edits.append((pos,f",{need!r}"))
          for pos,text in sorted(edits,reverse=True): s=s[:pos]+text+s[pos:]
          p.write_text(s)
          print('repaired helper calls',len(edits))
          PY
      - name: Apply exact patch
        run: python .github/scripts/issue25_patch.py
      - name: Static checks
        run: |
          git diff --check
          node --check kingfisher.js
          node --check tests/smoke.mjs
          node --check tests/mobile-e2e.mjs
          node --check tests/gesture-tuning.mjs
          node --check tests/untouched-regression.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kingfisher.js kingfisher.css index.html sw.js tests/smoke.mjs tests/mobile-e2e.mjs tests/gesture-tuning.mjs tests/untouched-regression.mjs
          git commit -m 'Implement Issue #25 CARDS dismiss and menu behavior'
          git push origin HEAD:cards-owner-swipe-menu-v2
