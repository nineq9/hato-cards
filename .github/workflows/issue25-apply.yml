name: Apply Issue 25 patch

on:
  push:
    branches: [cards-owner-swipe-menu-v2]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'cards-owner-swipe-menu-v2' && github.actor != 'github-actions[bot]' || github.ref == 'refs/heads/cards-owner-swipe-menu-v2' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cards-owner-swipe-menu-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize current implementation and QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Production is already patched on this branch. Normalize any generated duplication.
          p=Path('kingfisher.js'); s=p.read_text()
          s=s.replace('  function settleReader(){  function settleReader(){','  function settleReader(){')
          s=s.replace('  const TUTORIAL_COPY={  const TUTORIAL_COPY={','  const TUTORIAL_COPY={')
          p.write_text(s)

          # Repair gesture-tuning file generated by the first patch pass.
          p=Path('tests/gesture-tuning.mjs'); s=p.read_text()
          first_import=s.find("import { chromium }")
          if first_import>0: s=s[first_import:]
          start=s.rfind('// Required mixed one-handed journey:')
          end=s.find("fs.writeFileSync('test-output/gesture-profile-comparison.json'",start)
          if start<0 or end<0: raise SystemExit('mixed journey markers missing')
          mixed="""// Required mixed one-handed journey: READ → NEXT → READ → SAVE → READ → NEXT.
          {
            const page=await fresh(PROFILES.B_BALANCED);let id=await page.locator('.story-page').getAttribute('data-id');
            await touchPath(page,'#articleScroll',[[12,-7],[15,-34],[13,-82],[16,-155]],{duration:290,pos:[190,530]});await page.waitForTimeout(120);assert((await page.locator('#articleScroll').evaluate(e=>e.scrollTop))>50);assert.equal(await page.locator('.story-page').getAttribute('data-id'),id);
            await touchPath(page,'#articleScroll',THUMB_ARC_LEFT,{duration:250,pos:[190,310]});await page.waitForTimeout(520);let current=await page.locator('.story-page').getAttribute('data-id');assert.notEqual(current,id);assert((await page.locator('#articleScroll').evaluate(e=>e.scrollTop))<3);
            id=current;await touchPath(page,'#articleScroll',[[2,-25],[6,-70],[4,-145]],{duration:260,pos:[190,530]});await page.waitForTimeout(100);assert((await page.locator('#articleScroll').evaluate(e=>e.scrollTop))>40);
            await touchPath(page,'#articleScroll',THUMB_ARC_RIGHT,{duration:250,pos:[190,310]});await page.waitForTimeout(520);assert((await page.evaluate(id=>JSON.parse(localStorage.getItem('kingfisherSaved')||'[]').includes(id),id)));current=await page.locator('.story-page').getAttribute('data-id');assert.notEqual(current,id);assert((await page.locator('#articleScroll').evaluate(e=>e.scrollTop))<3);
            id=current;await touchPath(page,'#articleScroll',[[4,-24],[10,-65],[6,-125]],{duration:250,pos:[190,510]});await page.waitForTimeout(100);assert((await page.locator('#articleScroll').evaluate(e=>e.scrollTop))>30);
            await touchPath(page,'#articleScroll',THUMB_ARC_LEFT,{duration:250,pos:[190,310]});await page.waitForTimeout(520);assert.notEqual(await page.locator('.story-page').getAttribute('data-id'),id);assert((await page.locator('#articleScroll').evaluate(e=>e.scrollTop))<3);await neutral(page,'mixed journey final');await page.close();
          }

          """
          s=s[:start]+mixed+s[end:]
          p.write_text(s)

          # Cache bust the production behavioral change.
          p=Path('sw.js'); s=p.read_text(); s=re.sub(r"const CACHE='kingfisher-v\d+';","const CACHE='kingfisher-v19';",s,count=1); p.write_text(s)
          PY
      - name: Static checks
        run: |
          git diff --check
          node --check kingfisher.js
          node --check tests/smoke.mjs
          node --check tests/mobile-e2e.mjs
          node --check tests/gesture-tuning.mjs
          node --check tests/untouched-regression.mjs
      - name: Commit and rebase normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kingfisher.js sw.js tests/gesture-tuning.mjs
          if git diff --cached --quiet; then echo 'No normalization changes needed'; exit 0; fi
          git commit -m 'Normalize Issue #25 gesture QA and cache'
          git fetch origin cards-owner-swipe-menu-v2
          git rebase origin/cards-owner-swipe-menu-v2
          git push origin HEAD:cards-owner-swipe-menu-v2
