const N=[
['lavrov-us','REUTERS','UKRAINE','10:24 UTC','Russia seeks answers from US about alleged support for Ukrainian attacks, Lavrov says','https://www.reuters.com/world/europe/russia-seeks-answers-us-about-alleged-support-ukrainian-attacks-lavrov-says-2026-08-14/','ロシア、ウクライナ攻撃への米支援を巡り説明要求　ラブロフ氏','ロシア外相は、米国が情報提供を通じてウクライナのロシア領内攻撃に深く関与していると主張し、米国務省に説明を求めた。','ラブロフ外相は、情報データの提供とロシア領内への攻撃への関与について米側の回答を待っていると述べた。','情報共有や長距離攻撃支援が米露関係の新たな摩擦点になっている。','米国の回答と、西側供給網へのロシアの対応強化が焦点。','Россия требует от США объяснений по поводу поддержки украинских ударов — Лавров','Лавров заявил, что Москва запросила у Госдепартамента объяснения о роли американской разведки в украинских ударах по России.','Москва направила Вашингтону вопросы о передаче разведданных и участии США в ударах по российской территории.','Разведывательная поддержка становится отдельной линией конфронтации Москвы и Вашингтона.','Следить за ответом США и изменениями в западной помощи Украине.',1],
['black-sea','REUTERS','UKRAINE','10:14 UTC','Russia dismisses idea of Black Sea ceasefire','https://www.reuters.com/world/europe/russia-dismisses-idea-black-sea-ceasefire-2026-08-14/','ロシア、黒海での停戦案を拒否','黒海の商船への攻撃が増え穀物価格にも影響する中、ロシアは部分的な停戦に応じる根拠はないと表明した。','ロシア外務省は、黒海での軍事行動を一時停止する案に応じる理由はないとした。','黒海は軍事だけでなく穀物、石油、保険、輸送費に直結する。','トルコなど第三国による仲介が正式提案に進むかを見る。','Россия отвергла идею прекращения огня в Чёрном море','Москва заявила, что не видит оснований для частичного перемирия в Чёрном море на фоне атак на коммерческие суда.','МИД России отверг идею «полумер» и заявил, что формального предложения Турции не получал.','Чёрное море связано с экспортом зерна, нефти, страхованием и логистикой.','Следить, появится ли формальное посредническое предложение.',1],
['sumy','AP','UKRAINE','08:58 UTC','Russian drones kill a woman and 9-year-old son at home as Ukrainian civilian casualties surge','https://apnews.com/article/66f000409c6648239936b628a9eae0f5','ロシア無人機が住宅を攻撃、母親と9歳男児死亡　民間被害が増加','ウクライナ北部スームィ州で住宅が攻撃され、29歳女性と9歳の息子が死亡。国連は7月の民間被害が大幅に増えたと報告した。','APによると住宅への攻撃で母子が死亡。国連は7月に少なくとも437人の民間人が死亡したと報告した。','攻撃回数と長距離兵器の増加が、前線から離れた都市にも被害を広げている。','防空迎撃弾不足と民間防護の状況を見る。','Российские дроны убили женщину и её 9-летнего сына; потери среди гражданских растут','Удар по дому в Сумской области убил 29-летнюю женщину и её сына. ООН сообщает о резком росте гражданских жертв.','AP сообщает о гибели матери и ребёнка; ООН насчитала как минимум 437 погибших гражданских в июле.','Рост дальности и интенсивности ударов расширяет зону риска далеко за пределы фронта.','Следить за дефицитом ПВО и защитой гражданской инфраструктуры.',1],
['hormuz','REUTERS','WORLD','03:48 UTC','Hormuz shipping traffic capped amid competing claims from US and Iran','https://www.reuters.com/world/middle-east/hormuz-shipping-traffic-capped-amid-competing-claims-us-iran-2026-08-14/','ホルムズ海峡の船舶通行、米イラン対立で低水準','米国とイランが海峡の支配を巡り対立する中、商船通行量は8月平均を下回った。','Kplerでは木曜日の通過は9隻で、8月平均の12隻を下回った。','海峡の状態は石油、LNG、保険、運賃に直結する。','実際の通過隻数と保険料・原油価格をセットで見る。','Движение судов через Ормуз остаётся ниже нормы на фоне спора США и Ирана','Трафик через ключевой пролив остаётся ниже среднего за август, пока Вашингтон и Тегеран спорят о контроле.','По данным Kpler, в четверг прошли девять товарных судов при среднем августовском уровне в 12.','Ормуз напрямую влияет на нефть, СПГ, страхование и стоимость фрахта.','Следить за фактическим трафиком и ценой риска.',1],
['tankers','AP','WORLD','09:07 UTC','2 UAE tankers attacked while transiting Strait of Hormuz, and other news from the Middle East','https://apnews.com/article/e8565c608ac5283ec8103c85df924b13','UAEのタンカー2隻がホルムズ海峡で攻撃','ADNOC運航船2隻がドローン攻撃を受けた。負傷者はいないが、海上輸送リスクの高さを改めて示した。','APによるとADNOCのタンカー2隻が攻撃を受けた。負傷者はなく、状況は収束した。','船会社の回避行動や保険料上昇は物流コストを押し上げる。','攻撃頻度と商船ルート変更を見る。','Два танкера ОАЭ атакованы при проходе через Ормузский пролив','Два судна ADNOC подверглись атаке дронов. Пострадавших нет, но риски для судоходства растут.','По данным AP, два танкера ADNOC были атакованы; пострадавших нет, ситуация взята под контроль.','Рост страховых премий и изменение маршрутов увеличивают стоимость логистики.','Следить за частотой атак и поведением судовладельцев.',1],
['oil','REUTERS','ECONOMY','11:02 UTC','Oil climbs on tanker attacks, US-Iran claims about Hormuz control','https://www.reuters.com/business/energy/oil-set-weekly-gains-after-us-threatens-indefinite-blockade-iran-2026-08-14/','原油上昇、タンカー攻撃とホルムズ海峡の緊張で','BrentとWTIが上昇。タンカー攻撃、米国の対イラン封鎖発言、黒海の輸出停止が重なった。','Brentは約87.87ドル、WTIは約81.69ドルへ上昇した。','地政学リスクと実際の在庫・需要を分けて見る必要がある。','ホルムズ通行とロシア黒海輸出の復旧状況を見る。','Нефть дорожает после атак на танкеры и спора о контроле над Ормузом','Brent и WTI выросли на фоне атак на суда, угроз США в адрес Ирана и перебоев с экспортом через Чёрное море.','Brent поднялась примерно до $87,87, WTI — до $81,69 за баррель.','Нужно разделять геополитическую премию и реальные данные по запасам и спросу.','Следить за Ормузом и восстановлением экспорта через Чёрное море.',1],

['taiwan','REUTERS','TECH','08:26 UTC',"AI boom predicted to drive Taiwan's economy to grow fastest in four decades",'https://www.reuters.com/world/asia-pacific/taiwan-raises-2026-gdp-growth-projection-1105-2026-08-14/','AIブームで台湾成長率11.05%予測、約40年ぶりの高成長へ','AI半導体需要を背景に台湾政府が2026年GDP成長率予測を11.05%へ引き上げた。','台湾の成長率見通しは11.05%へ上方修正され、輸出は41.07%増の予測。','AI投資が企業業績だけでなく国全体の成長率や貿易を動かしている。','TSMCの設備投資とAI需要の持続性を見る。','Бум ИИ может обеспечить Тайваню самый быстрый рост почти за 40 лет','Правительство повысило прогноз роста ВВП Тайваня на 2026 год до 11,05% благодаря спросу на ИИ-чипы.','Прогноз роста повышен до 11,05%, экспорта — примерно на 41,07%.','ИИ-инвестиции уже влияют на макроэкономику и торговлю целой страны.','Следить за капвложениями TSMC и устойчивостью спроса на ИИ.',1],
['fires','REUTERS','CLIMATE','13:10 UTC','Climate focus: Europe wildfires hit tourist regions','https://www.reuters.com/sustainability/climate-focus-europe-wildfires-hit-tourist-regions-2026-08-14/','欧州の観光地で山火事、複数国で避難','クロアチア、ドイツ、フランス、ギリシャで山火事が拡大し、観光シーズン中に避難が相次いだ。','クロアチアで約1,000人、ドイツ西部で2,000人超が避難。フランスとギリシャでも火災が拡大した。','同時多発火災で消防航空機や人員そのものが不足するリスクがある。','気温・乾燥状況と広域の消防資源不足を見る。','Лесные пожары охватили туристические регионы Европы','Пожары в Хорватии, Германии, Франции и Греции привели к эвакуациям в разгар сезона.','Около тысячи человек эвакуировали в Хорватии и более двух тысяч на западе Германии.','Одновременные пожары в нескольких странах создают дефицит авиации и пожарных ресурсов.','Следить за жарой, засухой и доступностью сил пожаротушения.',1]
